services:
  # PostgreSQL is the shared source of truth for services, schedules, and bookings.
  # Docker keeps the local setup reproducible across Windows, macOS, and Linux.
  postgres:
    image: postgres:16-alpine
    container_name: appointment-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment_ops}
      POSTGRES_USER: ${POSTGRES_USER:-appointment_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointment_ops}
    # The first port is the host port; the second is the container port.
    ports:
      - "5432:5432"
    # A named volume keeps local database data after `docker compose down`.
    volumes:
      - appointment_ops_postgres_data:/var/lib/postgresql/data
    # Spring Boot should only connect after PostgreSQL is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ActiveMQ Artemis carries booking events between Java components.
  # The API publishes booking.created messages after the booking transaction
  # commits, and a JMS listener consumes them before calling n8n later.
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: appointment-ops-activemq
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-admin}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - appointment_ops_activemq_data:/var/lib/artemis-instance

  # n8n runs the workflow automation around persisted bookings.
  # Its own data volume keeps local workflows and the owner account after
  # the container is stopped and started again.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: appointment-ops-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Johannesburg}
      TZ: ${TZ:-Africa/Johannesburg}
      # This hostname lets a container reach services running on the host.
      # It will be useful when the JMS consumer or n8n calls localhost:8080.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
    volumes:
      - appointment_ops_n8n_data:/home/node/.n8n

volumes:
  appointment_ops_postgres_data:
  appointment_ops_activemq_data:
  appointment_ops_n8n_data:
