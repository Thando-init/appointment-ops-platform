<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Demo payment confirmation for Sable & Stone." />
    <title>Secure demo payment | Sable & Stone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=4" />
    <link rel="stylesheet" href="owner.css?v=1" />
</head>
<body>
<main class="owner-page payment-page">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Sable and Stone booking page"><span class="brand-mark" aria-hidden="true">S<span>&</span>S</span><span class="brand-name">Sable & Stone</span></a>
        <span class="owner-label">Demo payment</span>
    </header>
    <section class="owner-intro">
        <p class="eyebrow">Payment confirmation</p>
        <h1>Secure your <em>appointment.</em></h1>
        <p>This portfolio demo does not process real money. Use the button below to simulate a successful provider payment callback.</p>
    </section>
    <section class="review-card" aria-labelledby="payment-title">
        <div class="review-heading"><div><p class="eyebrow">Booking</p><h2 id="payment-title">Loading…</h2></div><span class="status-pill" id="payment-pill">Demo</span></div>
        <div class="review-grid" id="payment-details"><p class="review-message">Fetching the booking…</p></div>
        <div class="review-actions"><button class="button button-primary" id="pay-button" type="button" disabled>Simulate successful payment <span aria-hidden="true">→</span></button></div>
        <div class="review-message" id="payment-status" role="status" aria-live="polite"></div>
    </section>
    <p class="owner-footnote">Demo adapter only · No real payment is processed.</p>
</main>
<script src="demo-payment.js?v=1"></script>
</body>
</html>
