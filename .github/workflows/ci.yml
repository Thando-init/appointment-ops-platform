name: Appointment Ops CI

# CI runs on pull requests and pushes so every change receives the same checks.
on:
  push:
  pull_request:

jobs:
  unit-and-static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Java unit tests
        working-directory: services/booking-service
        run: mvn --batch-mode clean test

      - name: Check frontend JavaScript syntax
        run: |
          node --check apps/booking-form/app.js
          node --check apps/booking-form/tilt-effects.js

      - name: Validate n8n JSON files
        run: |
          python3 -m json.tool workflows/n8n/booking-intake.json >/dev/null
          python3 -m json.tool workflows/n8n/test-payload.json >/dev/null

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: unit-and-static-checks

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appointment_ops
          POSTGRES_USER: appointment_ops
          POSTGRES_PASSWORD: appointment_ops_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appointment_ops -d appointment_ops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the API
        working-directory: services/booking-service
        env:
          DB_URL: jdbc:postgresql://localhost:5432/appointment_ops
          DB_USERNAME: appointment_ops
          DB_PASSWORD: appointment_ops_dev_password
        run: |
          nohup mvn --batch-mode spring-boot:run > /tmp/booking-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:8080/api/v1/health

      - name: Run API acceptance tests
        run: python3 tests/acceptance/test_api.py

      - name: Print API log on failure
        if: failure()
        run: cat /tmp/booking-api.log
