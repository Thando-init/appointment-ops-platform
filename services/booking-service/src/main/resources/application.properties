# Local HTTP API port.
server.port=8080


# Appointment timestamps use South Africa local time.
spring.jackson.time-zone=Africa/Johannesburg

# PostgreSQL connection settings. The values after the colon are local defaults;
# environment variables can override them without changing this committed file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointment_ops}
spring.datasource.username=${DB_USERNAME:appointment_ops}
spring.datasource.password=${DB_PASSWORD:appointment_ops}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation and runs versioned migrations at startup.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# The static form runs on localhost:8000 during development.
spring.web.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000
